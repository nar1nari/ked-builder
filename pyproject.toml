[project]
name = "ked-builder-desktop"
version = "0.1.0"
description = "Desktop version of KED Builder"
readme = "README.md"
authors = [
    { name = "nar1nari", email = "nar1nariq@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "ked-builder",
]

[project.scripts]
ked-builder-desktop = "ked_builder_desktop:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
ked-builder = { git = "ssh://git@github.com/nar1nari/ked-builder.git" }

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "ruff>=0.16.10",
]
