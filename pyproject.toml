[project]
name = "ked-builder-web"
version = "0.1.0"
description = "Web Interface for ked builder"
readme = "README.md"
authors = [
    { name = "Viktor Lopushnyanu", email = "nar1nariq@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "ked-builder",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
ked-builder-web = "ked_builder_web:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
ked-builder = { git = "ssh://git@github.com/nar1nari/ked-builder.git" }
