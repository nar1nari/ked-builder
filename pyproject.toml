[project]
name = "ked-builder"
version = "1.1.2"
description = "A module for generating a catalog of elective courses based on educational programs"
readme = "README.md"
authors = [
    { name = "Viktor Lopushnyanu", email = "nar1nariq@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
]

[project.scripts]
ked-builder = "ked_builder:main"

[tool.setuptools.package-data]
ked_builder = ["documents/*.docx"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
